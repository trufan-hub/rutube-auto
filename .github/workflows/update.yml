
name: Refresh Rutube IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
  push:
    branches: [main]
    paths:
      - build.py
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh current Rutube streams and EPG mappings
        run: python build.py
      - name: Commit latest playlist and EPG match report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rutube.m3u docs/epg_report.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update Rutube streams and EPG IDs'
            git push
          fi
