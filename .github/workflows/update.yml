name: Refresh Rutube IPTV and publish Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'
  push:
    branches: [main]
    paths:
      - build.py
      - build_epg.py
      - logo_cache.py
      - test_logo_cache.py
      - check_release.py
      - .github/workflows/update.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rutube-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder and test persistent logos
        run: |
          python -m pip install 'Pillow==12.1.1'
          python -m unittest test_logo_cache.py

      - name: Refresh current Rutube streams and EPG mappings
        run: python build.py

      - name: Generate dedicated Rutube XMLTV EPG
        run: python build_epg.py

      - name: Validate release contract (EPG, logos, stream IDs)
        run: |
          python -m py_compile build.py build_epg.py logo_cache.py check_release.py
          python check_release.py

      - name: Create playlist landing page
        run: |
          cat > docs/index.html <<'EOF'
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><title>Rutube Auto</title></head>
          <body><h1>Rutube Auto</h1><p><a href="rutube.m3u">Открыть M3U-плейлист</a></p></body>
          </html>
          EOF

      - name: Commit updated playlist and EPG report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rutube.m3u docs/epg_report.csv docs/index.html docs/guide.xml docs/guide.xml.gz docs/epg_status.json docs/logos.json
          if [ -d docs/logos ]; then git add docs/logos/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Rutube streams and EPG mappings'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
